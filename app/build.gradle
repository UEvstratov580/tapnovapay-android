plugins {
    id 'com.android.application'
}

android {
    namespace 'org.tapnovapay.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "org.tapnovapay.wallet"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
}
